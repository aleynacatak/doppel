# Doppl demo access Worker: the desktop app sends AI requests here with an access code;
# the Worker checks limits and forwards them to Meta's Model API with the real key.
name = "doppel"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# api.doppl.work → this Worker (doppl.work must be a zone on the same Cloudflare account).
routes = [{ pattern = "api.doppl.work", custom_domain = true }]

[vars]
META_API_BASE_URL = "https://api.meta.ai/v1"
# Kill switch: "false" makes every AI endpoint answer demo_paused.
DEMO_ENABLED = "true"
# Allowed models (standard ones only, never the -contributor variants), their prices, the output token cap and the
# calls per creation come from the app's model registry, electron/ai/models.json (see src/models.ts).
MAX_REQUEST_BYTES = "10485760"
# Estimated spend caps in USD. Reaching either pauses the demo.
DAILY_SPEND_CAP = "20"
TOTAL_SPEND_CAP = "100"

[[d1_databases]]
binding = "DB"
database_name = "doppl-demo"
# From `npx wrangler d1 create doppl-demo` (an identifier, not a secret).
database_id = "00febba5-d3b5-499d-ad3c-9f3eeede17e8"
migrations_dir = "migrations"

# 30 requests per minute per access code.
[[ratelimits]]
name = "CODE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
